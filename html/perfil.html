  <body>
    <header>
      <h1>Plataforma de Orientación Estudiantil</h1>
      <img
        src="img/CareerPath.jpeg"
        alt="Logotipo oficial de la Plataforma de Orientación Estudiantil"
      />
      <nav aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>

          <li><a href="ruta.html">Ruta de Aprendizaje</a></li>

      </nav>
    </header>
    <main class="container py-5 d-block">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <section class="card border-0 shadow-sm p-0">
            <div class="card-body p-4">
              <h2 class="card-title text-center mb-4">Perfil del Estudiante</h2>

              <form>
                <div class="mb-3">
                  <label for="nombre" class="form-label">
                    Nombre y Apellido:
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    name="nombre"
                  />
                </div>

                <div class="mb-3">
                  <label for="intereses" class="form-label"> Intereses: </label>

                  <input
                    type="text"
                    class="form-control"
                    id="intereses"
                    name="intereses"
                  />
                </div>

                <div class="mb-4">
                  <label for="habilidades" class="form-label">
                    Habilidades:
                  </label>

                  <textarea
                    class="form-control"
                    id="habilidades"
                    name="habilidades"
                    rows="4"
                  ></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  Guardar Perfil
                </button>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>
